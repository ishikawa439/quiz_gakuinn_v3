<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学院生研究所 4択クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#0B0F14; --onink:#FFFFFF; --sub:#566170; --line:#C7CED6;
  --grid:rgba(11,15,20,.06); --acc:#0057FF; --onacc:#FFFFFF; --danger:#D7263D; --ondanger:#FFFFFF;
  --mono:"Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E13; --panel:#11171F; --ink:#E8EDF2; --onink:#0A0E13; --sub:#93A0AE; --line:#2A3542;
    --grid:rgba(232,237,242,.05); --acc:#3DA0FF; --onacc:#0A0E13; --danger:#FF6B7A; --ondanger:#0A0E13;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E13; --panel:#11171F; --ink:#E8EDF2; --onink:#0A0E13; --sub:#93A0AE; --line:#2A3542;
  --grid:rgba(232,237,242,.05); --acc:#3DA0FF; --onacc:#0A0E13; --danger:#FF6B7A; --ondanger:#0A0E13;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-weight:500; line-height:1.6; font-size:17px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:.12em}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:20px 20px 40px;position:relative}
.screen{display:none}
.screen.active{display:block}

/* 隠し管理者ボタン (左上・非表示) */
#adminHidden{
  position:fixed; top:env(safe-area-inset-top,0px); left:0;
  width:64px; height:64px; z-index:50;
  background:transparent; border:0; padding:0; opacity:0;
}
#adminHidden:focus-visible{opacity:1;background:var(--acc)}

/* ホーム */
.home{text-align:center;padding-top:36px;position:relative}
.deco{position:absolute;left:2px;top:88px;width:46px;height:72px;color:var(--ink);opacity:.55;pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.28em;color:var(--sub);text-transform:uppercase}
h1{font-size:46px;font-weight:700;margin:6px 0 4px;letter-spacing:.16em;line-height:1.2;text-indent:.16em}
.sub{font-family:var(--mono);font-size:16px;letter-spacing:.3em;margin:0 0 26px;color:var(--ink)}
.sub b{background:var(--ink);color:var(--onink);padding:2px 10px;margin-right:8px;font-weight:400}
.frame{position:relative;width:min(100%,420px);margin:0 auto 30px;padding:0}
.frame::before,.frame::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none}
.frame::before{left:-9px;top:-9px;border-left:3px solid var(--ink);border-top:3px solid var(--ink)}
.frame::after{right:-9px;bottom:-9px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.hero{
  width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--panel);border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{color:var(--sub);font-size:14px;padding:20px;font-family:var(--mono);letter-spacing:.06em}
.btn{
  display:inline-block;border:2px solid var(--ink);background:var(--ink);color:var(--onink);
  padding:13px 34px;font-weight:700;font-size:20px;letter-spacing:.12em;
  box-shadow:5px 5px 0 var(--acc);transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--acc)}
.btn.big{padding:18px 54px;font-size:26px}
.btn.ghost{background:var(--panel);color:var(--ink);font-size:16px;padding:9px 20px;box-shadow:3px 3px 0 var(--line);letter-spacing:.08em}
.btn.ghost:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.danger{background:var(--danger);color:var(--ondanger);border-color:var(--danger);box-shadow:3px 3px 0 var(--ink)}
.btn.danger:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* 共通 */
.card{background:var(--panel);border:2px solid var(--ink);padding:22px 22px 30px;position:relative}
.card::after{content:"";position:absolute;right:9px;bottom:9px;width:11px;height:11px;border:2px solid var(--ink);pointer-events:none}
h2{font-size:22px;font-weight:700;margin:0 0 14px;letter-spacing:.08em}
h2::before{content:"■ ";color:var(--acc);font-size:.7em;vertical-align:.12em}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=number],textarea{
  width:100%;font:inherit;font-size:18px;padding:11px 13px;border-radius:0;
  border:2px solid var(--line);background:var(--bg);color:var(--ink);
}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.hint{color:var(--sub);font-size:14px}

/* ニックネーム */
.nick{padding-top:48px}
.nick .card{text-align:center}
.nick input{text-align:center;font-size:24px;font-weight:700;margin:12px 0 22px;letter-spacing:.06em}
.err{color:var(--danger);font-weight:700;min-height:1.6em;margin:-12px 0 10px}

/* クイズ */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.qhead #qnum{font-family:var(--mono);letter-spacing:.14em;font-weight:400}
.bar{height:12px;border:2px solid var(--ink);background:var(--panel);margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qtext{font-size:24px;font-weight:700;line-height:1.5;margin:6px 0 20px;min-height:90px;word-break:break-word}
.choices{display:grid;grid-template-columns:1fr;gap:14px}
.choice{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:72px;
  padding:10px 16px 10px 10px;border:2px solid var(--ink);background:var(--panel);
  font-size:20px;font-weight:700;line-height:1.4;box-shadow:4px 4px 0 var(--line);
  transition:transform .08s, box-shadow .08s;word-break:break-word;
}
.choice .badge{
  flex:none;width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:400;font-size:26px;background:var(--ink);color:var(--onink);
}
.choice:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
.choice[disabled]{pointer-events:none}
.choice.dim{opacity:.4}
.choice.right{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:4px 4px 0 var(--ink)}
.choice.right .badge{background:var(--onacc);color:var(--acc)}
.choice.wrong{border-style:dashed;box-shadow:none}
.choice.wrong .lbl{text-decoration:line-through;text-decoration-thickness:2px}
.choice.wrong .badge{background:transparent;color:var(--ink);border:2px dashed var(--ink)}
.fb{margin-top:24px;text-align:center}
.verdict{font-size:46px;font-weight:700;line-height:1.2;letter-spacing:.1em}
.verdict .tag{display:block;font-family:var(--mono);font-weight:400;font-size:15px;letter-spacing:.35em;margin-bottom:2px}
.verdict.ok{color:var(--acc)} .verdict.ng{color:var(--ink)}
.verdict small{display:block;font-size:19px;color:var(--ink);font-weight:700;margin-top:6px;letter-spacing:.04em}
.expl{margin:8px 0 18px;color:var(--sub)}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .3s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}

/* 結果 */
.score{font-family:var(--mono);font-size:84px;line-height:1.1;letter-spacing:.04em}
.score span{font-size:34px}

.titlebox{margin:20px 0 24px;padding:16px 10px 18px;border:2px dashed var(--ink)}
.titlebox .tt{font-size:14px;color:var(--sub);letter-spacing:.3em}
.titlebox .ttl{font-size:42px;font-weight:700;letter-spacing:.14em;color:var(--acc);line-height:1.3;text-indent:.14em}

/* 管理者 */
.admin h2{margin-top:6px}
.admin .card{margin-bottom:20px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ph-item{position:relative;aspect-ratio:1;overflow:hidden;border:2px solid var(--line);padding:0;background:var(--bg)}
.ph-item img{width:100%;height:100%;object-fit:cover;display:block}
.ph-item.sel{border-color:var(--acc);border-width:3px}
.ph-item .tag{position:absolute;left:0;right:0;bottom:0;background:var(--acc);color:var(--onacc);font-size:12px;font-weight:700;text-align:center;letter-spacing:.1em}
.ph-item .x{
  position:absolute;top:4px;right:4px;width:28px;height:28px;
  background:var(--ink);color:var(--onink);border:0;font-size:16px;line-height:1;padding:0;
}
.opt{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.opt .pick{
  flex:none;width:48px;height:48px;border:2px solid var(--line);
  background:var(--bg);font-family:var(--mono);font-size:24px;line-height:1;padding:0;
}
.opt .pick.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--ink)}
.qlist .a{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:21px;background:var(--ink);color:var(--onink)}
.qlist .a.g{background:var(--acc);color:var(--onacc)}
.qlist .t{flex:1;word-break:break-word}
.qlist .t .s{display:block;color:var(--sub);font-size:14px}
.qlist .del{border:2px solid var(--line);background:var(--bg);padding:4px 10px;font-size:14px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,14,19,.65);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--panel);color:var(--ink);border:2px solid var(--ink);padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:8px 8px 0 var(--acc)}
.modal .msg{font-weight:700;font-size:18px;margin:0 0 18px;word-break:break-word}
.modal .row{justify-content:center}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--onink);padding:10px 20px;font-weight:700;letter-spacing:.06em;
  z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1}

/* 大画面(PC・タブレット横向き・プロジェクター) */
@media (min-width: 900px){
  body{font-size:22px}
  .app{max-width:1100px;padding:32px 48px 56px}
  .deco{width:170px;height:280px;left:40px;top:20px}
  .eyebrow{font-size:22px}
  h1{font-size:96px;margin:10px 0 8px}
  .sub{font-size:28px;margin-bottom:36px}
  .frame{width:min(100%,760px)}
  .btn.big{font-size:42px;padding:26px 96px}
  .nick{padding-top:90px}
  .nick .card{max-width:760px;margin:0 auto;padding:44px}
  .nick input{font-size:40px;padding:18px}
  .btn{font-size:28px;padding:18px 50px}
  .btn.ghost{font-size:21px;padding:12px 26px}
  .qhead{font-size:28px}
  .bar{height:18px}
  .card{padding:36px 36px 46px}
  .qtext{font-size:44px;min-height:140px}
  .choices{grid-template-columns:1fr 1fr;gap:28px}
  .choice{min-height:140px;font-size:34px;padding:16px 26px 16px 16px;gap:24px}
  .choice .badge{width:84px;height:84px;font-size:48px}
  .verdict{font-size:80px}
  .verdict .tag{font-size:24px}
  .verdict small{font-size:32px}
  .expl{font-size:26px}
  .score{font-size:150px}
  .score span{font-size:56px}
  .titlebox{padding:26px 10px 30px}
  .titlebox .tt{font-size:22px}
  .titlebox .ttl{font-size:92px}
  .admin{max-width:900px;margin:0 auto}
  .photos{grid-template-columns:repeat(5,1fr)}
  .modal .box{max-width:560px}
  .modal .msg{font-size:26px}
}
</style>
</head>
<body>
<div class="app">

  <button id="adminHidden" aria-label="管理者ページ"></button>

  <!-- ホーム -->
  <section id="home" class="screen active">
    <div class="home">
      <svg class="deco" viewBox="0 0 90 150" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M70 140 Q 8 90 40 8" stroke-dasharray="5 5"/>
        <path d="M40 8 L 40 8"/>
        <rect x="42" y="124" width="12" height="12"/>
        <path d="M30 140 H 70"/>
      </svg>
      <div class="eyebrow">GAKUIN STUDENT LABORATORY</div>
      <h1>学院生研究所</h1>
      <div class="sub"><b>4択</b>QUIZ</div>
      <div class="frame"><div class="hero" id="hero"></div></div>
      <button class="btn big" id="startBtn">クイズスタート</button>
    </div>
  </section>

  <!-- ニックネーム -->
  <section id="nick" class="screen">
    <div class="nick">
      <div class="card">
        <h2>ニックネームを入力</h2>
        <p class="hint" style="margin:0">結果画面に表示されます</p>
        <input type="text" id="nickInput" maxlength="12" placeholder="例:たろう" autocomplete="off">
        <div class="err" id="nickErr"></div>
        <button class="btn" id="nickGo">はじめる</button>
        <div style="margin-top:18px"><button class="btn ghost" id="nickBack">もどる</button></div>
      </div>
    </div>
  </section>

  <!-- クイズ -->
  <section id="quiz" class="screen">
    <div class="qhead"><span id="qnum"></span><span id="qname"></span></div>
    <div class="bar"><i id="qbar"></i></div>
    <div class="card">
      <div class="qtext" id="qtext"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="fb" id="fb" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="expl" id="expl"></div>
      <button class="btn" id="nextBtn">つぎへ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="card center" style="margin-top:24px">
      <div class="hint" id="rName"></div>
      <div class="score pop"><span id="rScore">0</span><span> / </span><span id="rTotal">0</span></div>
      <div class="titlebox pop">
        <div class="tt mono">TITLE / 称号</div>
        <div class="ttl" id="rTitle"></div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="homeBtn">トップへ</button>
      </div>
    </div>
  </section>

  <!-- 管理者 -->
  <section id="admin" class="screen admin">
    <div class="row spread" style="margin-bottom:6px">
      <h2 style="margin:0">管理者ページ</h2>
      <button class="btn ghost" id="adminBack">トップへ</button>
    </div>

    <div class="card">
      <h2>メイン画面の写真</h2>
      <p class="hint" style="margin:0 0 10px">写真を追加して、タップで表示する写真を選びます。</p>
      <input type="file" id="photoFile" accept="image/*" multiple hidden>
      <button class="btn ghost" id="photoAdd">写真を追加</button>
      <div class="photos" id="photos"></div>
      <div style="margin-top:12px"><button class="btn ghost" id="photoNone">写真を表示しない</button></div>
    </div>

    <div class="card">
      <h2>クイズを追加</h2>
      <label class="f" for="aq">問題文</label>
      <textarea id="aq" placeholder="例:日本で一番高い山はどれ?"></textarea>
      <label class="f">選択肢(4つとも入力し、正解の番号をタップ)</label>
      <div class="opt"><button class="pick on" id="pk0" aria-label="選択肢1を正解にする">1</button><input type="text" id="ch0" placeholder="選択肢1" autocomplete="off"></div>
      <div class="opt"><button class="pick" id="pk1" aria-label="選択肢2を正解にする">2</button><input type="text" id="ch1" placeholder="選択肢2" autocomplete="off"></div>
      <div class="opt"><button class="pick" id="pk2" aria-label="選択肢3を正解にする">3</button><input type="text" id="ch2" placeholder="選択肢3" autocomplete="off"></div>
      <div class="opt"><button class="pick" id="pk3" aria-label="選択肢4を正解にする">4</button><input type="text" id="ch3" placeholder="選択肢4" autocomplete="off"></div>
      <p class="hint" style="margin:0">緑の番号が正解です。</p>
      <label class="f" for="ae">解説(なくてもOK)</label>
      <textarea id="ae" placeholder="例:標高3,776mで日本最高峰です。"></textarea>
      <div style="margin-top:16px"><button class="btn" id="addQ">クイズを追加</button></div>
    </div>

    <div class="card">
      <h2>出題数</h2>
      <p class="hint" style="margin:0 0 10px">クイズ一覧からランダムに選んで出題します。</p>
      <div class="row">
        <input type="number" id="countInput" min="1" inputmode="numeric" style="width:110px;font-size:22px;text-align:center">
        <span>問(全 <span id="countAll">0</span> 問中)</span>
      </div>
      <p class="hint" id="countNote" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>クイズ一覧(<span id="qcount">0</span>問)</h2>
      <ul class="qlist" id="qlist"></ul>
    </div>

  </section>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <p class="msg" id="modalMsg"></p>
    <div class="row">
      <button class="btn ghost" id="modalNo">やめる</button>
      <button class="btn danger" id="modalYes">削除する</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var KEY = 'marubatsu_v1';
  var memory = null;

  function defaults(){
    return {
      photos: [], selected: null, count: null,
      quizzes: sampleQuizzes()
    };
  }
  function sampleQuizzes(){
    return [
      {id:'d1', q:'日本で一番高い山はどれ?', c:['富士山','北岳','槍ヶ岳','御嶽山'], a:0, e:'富士山は標高3,776mで日本最高峰です。'},
      {id:'d2', q:'タコの心臓はいくつある?', c:['1つ','2つ','3つ','4つ'], a:2, e:'えら心臓が2つ、全身に血を送る心臓が1つの、合計3つです。'},
      {id:'d3', q:'虹の色は、日本では一般に何色とされている?', c:['5色','6色','7色','8色'], a:2, e:'日本では赤・橙・黄・緑・青・藍・紫の7色とされています。'}
    ];
  }
  function valid(q){ return q && Array.isArray(q.c) && q.c.length === 4 && typeof q.a === 'number'; }
  function load(){
    var d = null;
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ d = JSON.parse(raw); }
    }catch(e){}
    if(!d || !Array.isArray(d.quizzes)) d = memory || defaults();
    // 旧形式(丸バツ)のクイズが残っている場合は4択のサンプルに置き換える
    if(!d.quizzes.length || !d.quizzes.every(valid)){
      d.quizzes = sampleQuizzes();
      d.count = null;
    }
    d.photos = d.photos || [];
    delete d.ranking; // ランキング機能は廃止
    return d;
  }
  var data = load();
  function save(){
    memory = data;
    try{ localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch(e){ return false; }
  }
  save();

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){t.classList.remove('show')}, 2200);
  }
  function show(id){
    ['home','nick','quiz','result','admin'].forEach(function(s){
      $(s).classList.toggle('active', s===id);
    });
    window.scrollTo(0,0);
  }
  function ask(msg, cb){
    $('modalMsg').textContent = msg;
    $('modal').classList.add('show');
    function close(){ $('modal').classList.remove('show'); $('modalYes').onclick = null; $('modalNo').onclick = null; }
    $('modalYes').onclick = function(){ close(); cb(); };
    $('modalNo').onclick = close;
    $('modalNo').focus();
  }
  function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  /* ---------- ホーム ---------- */
  function renderHero(){
    var h = $('hero'); h.innerHTML = '';
    var p = data.photos.filter(function(x){return x.id===data.selected})[0];
    if(p){ var img = new Image(); img.src = p.src; img.alt = ''; h.appendChild(img); }
    else { h.appendChild(el('div','ph','管理者ページで写真を選ぶと、ここに表示されます')); }
  }
  $('startBtn').onclick = function(){
    if(!data.quizzes.length){ toast('クイズがまだありません'); return; }
    $('nickErr').textContent = ''; show('nick'); $('nickInput').focus();
  };

  /* ---------- ニックネーム ---------- */
  var nickname = '';
  $('nickBack').onclick = function(){ show('home'); };
  $('nickInput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('nickGo').click(); });
  $('nickGo').onclick = function(){
    var v = $('nickInput').value.trim();
    if(!v){ $('nickErr').textContent = 'ニックネームを入力してください'; return; }
    nickname = v; startQuiz();
  };

  /* ---------- クイズ ---------- */
  var list = [], idx = 0, score = 0, answered = false;
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function questionCount(){
    var n = parseInt(data.count, 10);
    var all = data.quizzes.length;
    if(!n || n < 1 || n > all) return all;
    return n;
  }
  function startQuiz(){
    list = shuffle(data.quizzes).slice(0, questionCount()); idx = 0; score = 0;
    $('qname').textContent = nickname + ' さん';
    show('quiz'); showQ();
  }
  function showQ(){
    answered = false;
    var q = list[idx];
    $('qnum').textContent = '第' + (idx+1) + '問 / ' + list.length + '問';
    $('qbar').style.width = (idx/list.length*100) + '%';
    $('qtext').textContent = q.q;
    $('fb').hidden = true;
    var box = $('choices'); box.innerHTML = '';
    q.c.forEach(function(t, i){
      var b = el('button', 'choice c'+i);
      b.appendChild(el('span','badge', String(i+1)));
      b.appendChild(el('span','lbl', t));
      b.onclick = function(){ answer(i); };
      box.appendChild(b);
    });
  }
  function answer(i){
    if(answered) return; answered = true;
    var q = list[idx], ok = (i === q.a);
    if(ok) score++;
    var btns = $('choices').children;
    for(var k=0;k<btns.length;k++){
      btns[k].disabled = true;
      if(k === q.a) btns[k].classList.add('right');
      else if(k === i) btns[k].classList.add('wrong');
      else btns[k].classList.add('dim');
    }
    var v = $('verdict');
    v.className = 'verdict pop ' + (ok ? 'ok' : 'ng');
    v.textContent = '';
    v.appendChild(el('span','tag', ok ? 'CORRECT' : 'INCORRECT'));
    v.appendChild(document.createTextNode(ok ? '正解!' : '不正解'));
    v.appendChild(el('small', null, '正解は ' + (q.a+1) + '「' + q.c[q.a] + '」です'));
    $('expl').textContent = q.e || '';
    $('nextBtn').textContent = (idx === list.length-1) ? '結果を見る' : 'つぎへ';
    $('fb').hidden = false;
    $('qbar').style.width = ((idx+1)/list.length*100) + '%';
    $('fb').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  $('nextBtn').onclick = function(){
    if(idx < list.length-1){ idx++; showQ(); window.scrollTo(0,0); } else { finish(); }
  };

  /* ---------- 結果 ---------- */
  function titleFor(sc, total){
    var r = total ? sc/total : 0;
    if(r >= 1)  return '学院博士';
    if(r >= .8) return '学院教授';
    if(r >= .6) return '学院研究員';
    if(r >= .4) return '学院助手';
    if(r >= .2) return '学院見習い';
    return '学院入門者';
  }
  function finish(){
    $('rName').textContent = nickname + ' さんの結果';
    $('rScore').textContent = score; $('rTotal').textContent = list.length;
    $('rTitle').textContent = titleFor(score, list.length);
    show('result');
  }
  $('homeBtn').onclick = function(){ show('home'); };

  /* ---------- 管理者 ---------- */
  $('adminHidden').onclick = function(){ renderAdmin(); show('admin'); };
  $('adminBack').onclick = function(){ renderHero(); show('home'); };

  function resize(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 900, w = img.width, h = img.height, s = Math.min(1, max/Math.max(w,h));
        var c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = function(){ cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function(){ cb(null); };
    fr.readAsDataURL(file);
  }
  $('photoAdd').onclick = function(){ $('photoFile').click(); };
  $('photoFile').onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    var pending = files.length, added = 0;
    files.forEach(function(f){
      resize(f, function(src){
        if(src){ data.photos.push({id:uid(), src:src}); added++; }
        if(--pending === 0){
          if(added && !data.selected) data.selected = data.photos[data.photos.length-1].id;
          if(!save()) toast('保存容量がいっぱいです。写真を減らしてください');
          else if(added) toast(added + '枚追加しました');
          else toast('写真を読み込めませんでした');
          renderAdmin();
        }
      });
    });
  };
  $('photoNone').onclick = function(){ data.selected = null; save(); renderAdmin(); toast('写真を非表示にしました'); };

  // 4択の追加フォーム
  var correct = 0;
  function setCorrect(i){
    correct = i;
    for(var k=0;k<4;k++) $('pk'+k).classList.toggle('on', k===i);
  }
  for(var k=0;k<4;k++){ (function(i){ $('pk'+i).onclick = function(){ setCorrect(i); }; })(k); }

  $('addQ').onclick = function(){
    var q = $('aq').value.trim();
    if(!q){ toast('問題文を入力してください'); $('aq').focus(); return; }
    var c = [];
    for(var k=0;k<4;k++){
      var v = $('ch'+k).value.trim();
      if(!v){ toast('選択肢' + (k+1) + 'を入力してください'); $('ch'+k).focus(); return; }
      c.push(v);
    }
    data.quizzes.push({id:uid(), q:q, c:c, a:correct, e:$('ae').value.trim()});
    if(!save()) toast('保存できませんでした(このセッションのみ有効)');
    else toast('クイズを追加しました');
    $('aq').value = ''; $('ae').value = '';
    for(var j=0;j<4;j++) $('ch'+j).value = '';
    setCorrect(0);
    renderAdmin();
  };

  function renderCount(){
    var all = data.quizzes.length;
    $('countAll').textContent = all;
    $('countInput').max = all;
    $('countInput').value = questionCount();
    $('countNote').textContent = all ? '' : 'クイズを追加すると設定できます';
  }
  $('countInput').addEventListener('change', function(){
    var all = data.quizzes.length;
    var n = parseInt($('countInput').value, 10);
    if(!n || n < 1) n = 1;
    if(n > all){ n = all; toast('クイズは全部で' + all + '問です'); }
    data.count = n; save(); renderCount();
    toast('出題数を' + n + '問にしました');
  });

  function renderAdmin(){
    renderCount();
    var box = $('photos'); box.innerHTML = '';
    if(!data.photos.length) box.appendChild(el('p','hint','写真はまだありません'));
    data.photos.forEach(function(p){
      var b = el('button','ph-item' + (p.id===data.selected ? ' sel' : ''));
      b.setAttribute('aria-label','この写真を表示する');
      var img = new Image(); img.src = p.src; img.alt = ''; b.appendChild(img);
      if(p.id===data.selected) b.appendChild(el('span','tag','表示中'));
      var x = el('button','x','×'); x.setAttribute('aria-label','写真を削除');
      x.onclick = function(ev){
        ev.stopPropagation();
        ask('この写真を削除しますか?', function(){
          data.photos = data.photos.filter(function(q){return q.id!==p.id});
          if(data.selected===p.id) data.selected = null;
          save(); renderAdmin();
        });
      };
      b.appendChild(x);
      b.onclick = function(){ data.selected = p.id; save(); renderAdmin(); toast('メイン画面の写真に設定しました'); };
      box.appendChild(b);
    });

    $('qcount').textContent = data.quizzes.length;
    var ul = $('qlist'); ul.innerHTML = '';
    if(!data.quizzes.length) ul.appendChild(el('li','hint','クイズがありません。上のフォームから追加してください'));
    data.quizzes.forEach(function(q){
      var li = el('li');
      li.appendChild(el('div','a g', q.a+1));
      var t = el('div','t', q.q);
      t.appendChild(el('span','s','正解:' + q.c[q.a] + '(他:' + q.c.filter(function(_,i){return i!==q.a}).join('/') + ')'));
      li.appendChild(t);
      var d = el('button','del','削除');
      d.onclick = function(){
        ask('このクイズを削除しますか?', function(){
          data.quizzes = data.quizzes.filter(function(z){return z.id!==q.id});
          save(); renderAdmin();
        });
      };
      li.appendChild(d);
      ul.appendChild(li);
    });
  }

  renderHero();
})();
</script>
</body>
</html>
